packages:
  - '.'

autoInstallPeers: false

allowBuilds:
  cloudflared: true
  cpu-features: true
  esbuild: true
  node-pty: true
  ssh2: true

packageExtensions:
  '@deepseek-ai/dsh-client-store@0.2.1-rc.2':
    dependencies:
      zustand: '~4.4.7'
      immer: '^10.1.1'
  '@deepseek-ai/dsh-client-ui-primitives@0.2.1-rc.2':
    dependencies:
      anser: '^2.3.5'
      clsx: '^2.0.0'
      # New at 0.1.6-alpha.1: the emitted lib/index.js imports `diff` for its
      # DiffBlock renderer, and the published manifest still declares no
      # runtime dependencies at all. Version read from the official host
      # install (`@deepseek-ai/dsh@0.1.6-alpha.1` -> diff 9.0.0).
      diff: '^9.0.0'
      katex: '^0.16.47'
      shiki: '^4.3.1'
      '@shikijs/langs': '^4.3.1'
      mdast-util-from-markdown: '^2.0.3'
      mdast-util-gfm: '^3.1.0'
      mdast-util-math: '^3.0.0'
      micromark-core-commonmark: '^2.0.3'
      micromark-extension-gfm: '^3.0.0'
      micromark-extension-math: '^3.1.0'
      micromark-factory-space: '^2.0.1'
      micromark-util-character: '^2.1.1'
      micromark-util-classify-character: '^2.0.1'
      micromark-util-sanitize-uri: '^2.0.1'
      micromark-util-symbol: '^2.0.1'
      # New at 0.1.7-alpha.1: the emitted lib/index.js imports
      # `@deepseek-ai/dsh-util-workspace-path` for its workspace-relative path
      # rendering, and the published manifest still declares no dependencies at
      # all (peer `@deepseek-ai/cordis` only). Version read from the cohort's own
      # publish; it is an exact pin in the official source devDependencies.
      '@deepseek-ai/dsh-util-workspace-path': '0.2.1-rc.2'
      # The emitted lib/index.js also imports `@deepseek-ai/dsh-util-code-language`,
      # which the published manifest likewise omits. The package's cohort pin is
      # the exact target version.
      '@deepseek-ai/dsh-util-code-language': '0.2.1-rc.2'
      # New at 0.1.6-alpha.2: the emitted lib/index.js imports `simple-icons`
      # for the markdown link glyphs, and the published manifest still declares
      # no runtime dependencies at all. Version is the exact pin the official
      # source resolves (packages/client/ui-primitives devDependencies ->
      # simple-icons 16.31.0).
      simple-icons: '16.31.0'
